; ============================================================
;  PlatformIO project configuration
;  ESP32 RF/IR Multi-Tool
; ============================================================
[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

; Serial monitor
monitor_speed = 115200
upload_speed  = 921600

; Build flags
build_flags =
    -DARDUINO_ESP32_DEV
    -DCORE_DEBUG_LEVEL=0

; Required libraries
lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit ILI9488
    paulstoffregen/XPT2046_Touchscreen
    Arduino-IRremote/IRremote @ ^4.4.0
    sui77/rc-switch
