; PlatformIO Project Configuration
; ESP32 Multi-Tool: BLE Scan, WiFi Scan, 433MHz RF, IR, GPS

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

; Increase upload speed and monitor baud
upload_speed   = 921600
monitor_speed  = 115200

; Required libraries
lib_deps =
    sui77/rc-switch @ ^2.6.4
    crankyoldgit/IRremoteESP8266 @ ^2.8.6
    mikalhart/TinyGPSPlus @ ^1.0.3

; Build flags: disable strict warnings from third-party libs
build_flags =
    -DCORE_DEBUG_LEVEL=0
