; ============================================================
;  PlatformIO – ESP32 All-in-One Multi-Tool
;  IR + AC + RF 433 + BLE + WiFi + GPS
; ============================================================
[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

; Serial monitor
monitor_speed = 115200
upload_speed  = 921600

; Build flags
build_flags =
    -DARDUINO_ESP32_DEV
    -DCORE_DEBUG_LEVEL=0

; Required libraries
lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit ILI9488
    paulstoffregen/XPT2046_Touchscreen
    crankyoldgit/IRremoteESP8266 @ ^2.8.6
    sui77/rc-switch @ ^2.6.4
    mikalhart/TinyGPSPlus @ ^1.0.3
