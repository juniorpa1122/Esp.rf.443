; PlatformIO Project Configuration File
; ESP32 – ILI9488 touchscreen + IR + RF 433 + general scanner

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

; Serial monitor
monitor_speed = 115200

lib_deps =
    ; Adafruit graphics stack
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit ILI9341 @ ^1.6.0      ; ILI9488 uses the same SPI driver with slight init changes
    ; Touchscreen controller
    paulstoffregen/XPT2046_Touchscreen @ ^1.4.0
    ; IR library (ESP32-compatible fork of IRremote)
    crankyoldgit/IRremoteESP8266 @ ^2.8.6
    ; 433 MHz / OOK library
    sui77/rc-switch @ ^2.6.4

build_flags =
    -DCORE_DEBUG_LEVEL=0
