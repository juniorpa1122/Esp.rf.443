; ============================================================
; PlatformIO project configuration – ESP32 RF Tool
; ============================================================
[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

; Required libraries
lib_deps =
    adafruit/Adafruit ST7789@^1.10.3
    adafruit/Adafruit GFX Library@^1.11.9
    sui77/rc-switch@^2.6.4

; Upload & monitor settings
monitor_speed = 115200
upload_speed  = 921600

; Build flags: increase stack size for BLE
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_ESP32_DEV
